    'add-photo': (el) => {
      const insId = el.dataset.insId, secId = el.dataset.secId, itemId = el.dataset.itemId;
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.capture = 'environment';
      input.onchange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        // Try to get GPS position (with silent fallback)
        const getGeo = () => new Promise((resolve) => {
          if (!navigator.geolocation) { resolve(null); return; }
          const timer = setTimeout(() => resolve(null), 8000);
          navigator.geolocation.getCurrentPosition(
            (pos) => { clearTimeout(timer); resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy, at: Date.now() }); },
            () => { clearTimeout(timer); resolve(null); },
            { enableHighAccuracy: true, timeout: 6000, maximumAge: 30000 }
          );
        });
        Promise.all([compressImage(file, 1200, 0.75), getGeo()]).then(([dataUrl, gps]) => {
          const item = findItem(insId, secId, itemId);
          if (!item) return;
          item.photos = item.photos || [];
          const photo = { id: uid(), data: dataUrl, annotations: [] };
          if (gps) photo.gps = gps;
          item.photos.push(photo);
          if (saveStorage(STORAGE_KEY, state.inspections)) {
            showToast(gps ? t('photo_gps') : t('photo_ok'), 'success');
            render();
          }
        }).catch(err => {
          console.error('Image processing failed:', err);
          showToast(t('photo_error'), 'error');
        });
      };
      input.click();
    },

    'complete-inspection': (el) => {
      const ins = findIns(el.dataset.id);
      if (!ins) return;
      
      // v2.1 : Threshold check
      const tpl = state.templates.find(x => x.id === ins.templateId);
      const threshold = (tpl && tpl.conformityThreshold != null) ? tpl.conformityThreshold : 85;
      
      let passed = 0, failed = 0;
      ins.sections.forEach(s => s.items.forEach(i => {
        if (i.status === 'pass' || (i.status === 'fail' && i.lifted)) passed++;
        else if (i.status === 'fail') failed++;
      }));
      const scored = passed + failed;
      const conformity = scored > 0 ? Math.round(passed / scored * 100) : 100;
      
      // Check if a followup audit has been created for this inspection
      const hasFollowup = state.inspections.some(i => i.parentInspectionId === ins.id);
      
      if (conformity < threshold) {
        showToast(t('threshold_suggest'), 'warning');
        return;
      }
      
      ins.status = 'completed';
      ins.completedAt = Date.now();
      saveStorage(STORAGE_KEY, state.inspections);
      showToast(t('audit_closed'), 'success');
      render();
    },

      const verifyDate = new Date(dateStr);
      if (isNaN(verifyDate.getTime())) { showToast(t('nc_date_invalid'), 'error'); return; }

      const comment = prompt(t('nc_comment') + ' :');
      if (!comment || comment.trim().length < 20) { showToast(t('nc_comment_short'), 'error'); return; }

      item.lifted = true;
      item.liftedBy = verifier.trim();
      item.liftedAt = verifyDate.getTime();
      item.liftedComment = comment.trim();
      item.liftedByAdmin = state.profile.name || 'Admin';
      item.history = item.history || [];
      item.history.push({
        type: 'lift',
        at: Date.now(),
        by: state.profile.name || 'Admin',
        verifier: verifier.trim(),

  // ===== CLICK DISPATCHER =====
  document.body.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    if (actions[action]) {
      e.preventDefault();
      actions[action](btn);
    }
  }, true);

  // ===== INPUT / CHANGE HANDLERS =====
  document.body.addEventListener('input', (e) => {
    const t2 = e.target;
    if (!t2.dataset.bind) return;
    const bind = t2.dataset.bind;
    const val = t2.value;

    // newDraft binds
    if (bind.startsWith('newDraft.')) {
      const key = bind.replace('newDraft.', '');
      state.newDraft[key] = val;
      return;
    }
    // inspection binds
    if (bind === 'inspection.notes') {
      const ins = findIns(t2.dataset.id);
      if (ins) { ins.notes = val; saveStorage(STORAGE_KEY, state.inspections); }
      return;
    }
    if (bind === 'item.comment') {
      const ins = findIns(t2.dataset.insId);
      if (!ins) return;
      const sec = ins.sections.find(s => s.id === t2.dataset.secId);
      if (!sec) return;
      const item = sec.items.find(i => i.id === t2.dataset.itemId);
      if (item) { item.comment = val; saveStorage(STORAGE_KEY, state.inspections); }
      return;
    }
    if (bind === 'item.value') {
      const ins = findIns(t2.dataset.insId);
      if (!ins) return;
      const sec = ins.sections.find(s => s.id === t2.dataset.secId);
      if (!sec) return;
      const item = sec.items.find(i => i.id === t2.dataset.itemId);
      if (item) {
        item.value = t2.type === 'number' ? parseFloat(val) : val;
        // Auto-status for number items
        if (t2.type === 'number' && item.type === 'number') {
          const v = parseFloat(val);
          if (!isNaN(v)) {
            if (item.min != null && v < item.min) item.status = 'fail';
            else if (item.max != null && v > item.max) item.status = 'fail';
            else if (item.threshold != null && v < item.threshold) item.status = 'fail';
            else item.status = 'pass';
          }
        }
        saveStorage(STORAGE_KEY, state.inspections);
        render();
      }
      return;
    }
    // template editor binds
    if (bind === 'template.name' && state.editingTemplate) { state.editingTemplate.name = val; return; }
    if (bind === 'template.registerType' && state.editingTemplate) { state.editingTemplate.registerType = val; return; }
    if (bind.startsWith('template.section.') && state.editingTemplate) {
      const sIdx = parseInt(t2.dataset.sectionIdx);
      const iIdx = t2.dataset.itemIdx !== undefined ? parseInt(t2.dataset.itemIdx) : null;
      if (bind === 'template.section.title') { state.editingTemplate.sections[sIdx].title = val; return; }
      if (iIdx !== null) {
        const item = normalizeTemplateItem(state.editingTemplate.sections[sIdx].items[iIdx]);
        if (bind === 'template.section.item.label') item.label = val;
        else if (bind === 'template.section.item.unit') item.unit = val;
        else if (bind === 'template.section.item.min') item.min = val === '' ? null : parseFloat(val);
        else if (bind === 'template.section.item.max') item.max = val === '' ? null : parseFloat(val);
        else if (bind === 'template.section.item.placeholder') item.placeholder = val;
        else if (bind === 'template.section.item.options') item.options = val.split('\n').map(s => s.trim()).filter(Boolean);
        state.editingTemplate.sections[sIdx].items[iIdx] = item;
        render(); return;
      }
    }
  });

  document.body.addEventListener('change', (e) => {
    const t2 = e.target;
    if (t2.id === 'import-file') {
      const file = t2.files && t2.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          let addedIns = 0, skippedIns = 0, addedTpl = 0, skippedTpl = 0;
          if (data.inspections) {
            data.inspections.forEach(ins => {
              if (!state.inspections.find(i => i.id === ins.id)) { state.inspections.push(ins); addedIns++; }
              else skippedIns++;
            });
          }
          if (data.templates) {
            data.templates.forEach(tpl => {
              if (!state.templates.find(t => t.id === tpl.id)) { state.templates.push(tpl); addedTpl++; }
              else skippedTpl++;
            });
          }
          if (data.profile) state.profile = data.profile;
          saveStorage(STORAGE_KEY, state.inspections);
          saveStorage(TEMPLATES_KEY, state.templates);
          saveStorage(PROFILE_KEY, state.profile);
          showToast(t('import_ok') + ' ' + addedIns + ' ' + t('import_added') + ', ' + skippedIns + ' ' + t('import_skipped'), 'success');
          render();
        } catch(err) { showToast('Import error: ' + err.message, 'error'); }
      };
      reader.readAsText(file);
      t2.value = '';
      return;
    }
    if (t2.dataset.bind === 'item.value') {
      const ins = findIns(t2.dataset.insId);
      if (!ins) return;
      const sec = ins.sections.find(s => s.id === t2.dataset.secId);
      if (!sec) return;
      const item = sec.items.find(i => i.id === t2.dataset.itemId);
      if (item) {
        if (t2.type === 'checkbox') {
          const vals = item.values || [];
          if (t2.checked) vals.push(t2.value); else { const idx = vals.indexOf(t2.value); if (idx > -1) vals.splice(idx,1); }
          item.values = vals;
        } else {
          item.value = t2.value;
        }
        saveStorage(STORAGE_KEY, state.inspections);
        render();
      }
    }
  });

  // ===== GENERATE PDF AUDIT =====
  function exportPDF(insId) {
    const ins = findIns(insId);
    if (!ins) return;
    if (!window.jspdf || !window.jspdf.jsPDF) {
      showToast(t('pdf_error_lib'), 'error');
      return;
    }
    state.pdfGenerating = true;
    render();
    // Collect photos
    const photoCache = [];
    ins.sections.forEach(s => s.items.forEach(item => {
      if (item.photos) item.photos.forEach(p => { if (p.data) photoCache.push({ data: p.data, caption: item.label }); });
    }));
    setTimeout(() => {
      try { generatePDFDocument(ins, photoCache); }
      catch(e) { showToast(t('pdf_error') + ': ' + e.message, 'error'); }
      finally { state.pdfGenerating = false; render(); }
    }, 100);
  }

  function generatePDFDocument(ins, photoCache) {
    const tpl = state.templates.find(t => t.id === ins.templateId);
    const reportType = (tpl && tpl.reportType) ? tpl.reportType : (ins.reportType || 'audit');
    if (reportType === 'form') return generatePDFForm(ins, photoCache);
    if (reportType === 'checklist') return generatePDFChecklist(ins, photoCache);
    return generatePDFAudit(ins, photoCache);
  }

  function generatePDFAudit(ins, photoCache) {
    const jsPDFCtor = window.jspdf.jsPDF;
    const doc = new jsPDFCtor({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const profile = state.profile;
    const pageW = 210, margin = 14, contentW = pageW - margin * 2;
    const pageH = 297;
    let y = margin;

    function ensureSpace(needed) {
      if (y + needed > pageH - margin - 8) { doc.addPage(); y = margin; }
    }
    function setFillHex(hex) {
      doc.setFillColor(parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16));
    }
    function setTextHex(hex) {
      doc.setTextColor(parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16));
    }

    // Header
    setFillHex('#0f172a');
    doc.rect(0, 0, pageW, 28, 'F');
    setFillHex('#8b5cf6');
    doc.rect(0, 0, pageW, 4, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.setTextColor(255,255,255);
    doc.text('QSE', margin, y + 12);
    doc.setTextColor(167, 139, 250);
    doc.text(' INSPECTOR', margin + 16, y + 12);
    doc.setTextColor(148, 163, 184); doc.setFontSize(8); doc.setFont('helvetica', 'normal');
    doc.text('// Rapport d\'audit Qualite, Securite, Environnement', margin, y + 17);
    doc.setTextColor(255,255,255); doc.setFontSize(9);
    doc.text(profile.company, pageW - margin, y + 8, { align: 'right' });
    doc.text(profile.name, pageW - margin, y + 14, { align: 'right' });
    y += 32;

    // Titre audit
    doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(15,23,42);
    const titleLines = doc.splitTextToSize(ins.title || '', contentW);
    doc.text(titleLines, margin, y);
    y += titleLines.length * 6 + 4;

    // Métadonnées
    const meta = [
      ['Date', new Date(ins.createdAt).toLocaleDateString('fr-FR')],
      ['Lieu', ins.location || '—'],
      ['Inspecteur', ins.inspector || profile.name],
      ['Statut', ins.status === 'completed' ? 'Clôturé' : 'En cours'],
    ];
    const colW = contentW / 4;
    setFillHex('#f8fafc');
    doc.rect(margin, y, contentW, 14, 'F');
    meta.forEach((m, i) => {
      const x = margin + i * colW;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(7); setTextHex('#64748b');
      doc.text(m[0].toUpperCase(), x + 2, y + 5);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9); setTextHex('#0f172a');
      doc.text(m[1], x + 2, y + 11);
    });
    y += 18;

    // Stats
    const allItems = ins.sections.flatMap(s => s.items);
    const scored = allItems.filter(i => i.status && i.status !== 'na' && i.status !== 'pending');
    const passed = scored.filter(i => i.status === 'pass' || i.status === 'oa').length;
    const failed = scored.filter(i => i.status === 'fail').length;
    const na = allItems.filter(i => i.status === 'na').length;
    const rate = scored.length > 0 ? Math.round(passed / scored.length * 100) : 0;
    const statW = contentW / 4;
    const stats = [
      { num: failed, lbl: 'NON-CONFORMITES', color: '#ef4444', text: '#b91c1c' },
      { num: na, lbl: 'N/A', color: '#64748b', text: '#334155' },
      { num: rate + '%', lbl: 'CONFORMITE', color: '#8b5cf6', text: '#6d28d9' }
    ];
    stats.forEach((s, i) => {
      const x = margin + i * (statW + 2);
      doc.setDrawColor(226, 232, 240);
      doc.rect(x, y, statW, 16);
      setFillHex(s.color);
      doc.rect(x, y, 1.5, 16, 'F');
      setTextHex(s.text);
      doc.setFontSize(14);
      doc.setFont('helvetica', 'bold');
      doc.text(String(s.num), x + statW / 2, y + 7.5, { align: 'center' });
      setTextHex('#64748b');
      doc.setFontSize(6);
      doc.text(s.lbl, x + statW / 2, y + 13, { align: 'center' });
    });
    y += 22;

    // ===== SECTIONS =====
    ins.sections.forEach(sec => {
      ensureSpace(15);
      setFillHex('#0f172a');
      doc.rect(margin, y, contentW, 7, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(10);
      doc.setFont('helvetica', 'bold');
      doc.text(sec.title.toUpperCase(), margin + 3, y + 5);
      y += 10;

      sec.items.forEach(item => {
        const labelLines = doc.splitTextToSize(item.label, contentW - 25);
        const commentLines = item.comment ? doc.splitTextToSize(item.comment, contentW - 30) : [];
        const hasPhotos = item.photos && item.photos.length > 0;
        const photoRowH = hasPhotos ? 28 : 0;
        const blockH = labelLines.length * 4 + commentLines.length * 3.5 + photoRowH + 6;
        ensureSpace(blockH);

        const badgeColors = {
          pass: { bg: '#d1fae5', text: '#065f46', label: 'OK' },
          fail: { bg: '#fee2e2', text: '#991b1b', label: 'NC' },
          na: { bg: '#e2e8f0', text: '#334155', label: 'N/A' }
        };
        const b = badgeColors[item.status] || { bg: '#fef3c7', text: '#92400e', label: '-' };
        setFillHex(b.bg);
        doc.rect(margin, y, 18, 5, 'F');
        setTextHex(b.text);
        doc.setFontSize(7);
        doc.setFont('helvetica', 'bold');
        doc.text(b.label, margin + 9, y + 3.5, { align: 'center' });

        setTextHex('#1e293b');
        doc.setFontSize(9);
        doc.setFont('helvetica', 'normal');
        doc.text(labelLines, margin + 21, y + 3.5);
        y += Math.max(5, labelLines.length * 4) + 1;

        if (commentLines.length > 0) {
          const commentH = commentLines.length * 3.5 + 3;
          setFillHex('#fef2f2');
          doc.rect(margin + 21, y, contentW - 21, commentH, 'F');
          setFillHex('#ef4444');
          doc.rect(margin + 21, y, 0.8, commentH, 'F');
          setTextHex('#475569');
          doc.setFontSize(8);
          doc.setFont('helvetica', 'italic');
          doc.text(commentLines, margin + 24, y + 3.5);
          y += commentH + 1;
        }

        if (hasPhotos) {
          let photoX = margin + 21;
          const photoSize = 24;
          item.photos.forEach(p => {
            if (photoX + photoSize > pageW - margin) {
              y += photoSize + 2;
              ensureSpace(photoSize + 2);
              photoX = margin + 21;
            }
            try {
              const imgData = photoCache[p.id] || p.data;
              doc.addImage(imgData, 'JPEG', photoX, y, photoSize, photoSize, undefined, 'FAST');
            } catch (err) {
              console.warn('Photo embed failed:', err);
            }
            photoX += photoSize + 2;
          });
          y += photoSize + 3;
        }
        y += 2;
        doc.setDrawColor(241, 245, 249);
        doc.line(margin, y, pageW - margin, y);
        y += 2;
      });
      y += 4;
    });

    // ===== NOTES =====
    if (ins.notes) {
      const noteLines = doc.splitTextToSize(ins.notes, contentW - 6);
      const noteH = noteLines.length * 4 + 8;
      ensureSpace(noteH + 4);
      setFillHex('#f1f5f9');
      doc.rect(margin, y, contentW, noteH, 'F');
      setFillHex('#8b5cf6');
      doc.rect(margin, y, 1.5, noteH, 'F');
      setTextHex('#64748b');
      doc.setFontSize(7);
      doc.setFont('helvetica', 'bold');
      doc.text('SYNTHESE & RECOMMANDATIONS', margin + 4, y + 4);
      setTextHex('#1e293b');
      doc.setFontSize(9);
      doc.setFont('helvetica', 'normal');
      doc.text(noteLines, margin + 4, y + 8);
      y += noteH + 4;
    }

    // ===== FOOTER =====
    const totalPages = doc.internal.getNumberOfPages();
    for (let p = 1; p <= totalPages; p++) {
      doc.setPage(p);
      doc.setDrawColor(226, 232, 240);
      doc.line(margin, pageH - 10, pageW - margin, pageH - 10);
      setTextHex('#94a3b8');
      doc.setFontSize(7);
      doc.setFont('helvetica', 'normal');
      doc.text('Rapport genere par QSE Inspector - ' + new Date().toLocaleString('fr-FR'), margin, pageH - 6);
      doc.text('Page ' + p + ' / ' + totalPages, pageW - margin, pageH - 6, { align: 'right' });
    }

    const safeName = (ins.title || 'audit').replace(/[^a-zA-Z0-9_-]/g, '_').slice(0, 40);
    const fileName = 'QSE-' + safeName + '-' + new Date().toISOString().slice(0, 10) + '.pdf';
    doc.save(fileName);
  }

  // ===== RENDERER FORMULAIRE DÉCLARATIF (AT, incidents, visites...) =====
  function generatePDFForm(ins, photoCache) {
    const jsPDFCtor = window.jspdf.jsPDF;
    const doc = new jsPDFCtor({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const profile = state.profile;
    const tpl = state.templates.find(t => t.id === ins.templateId);
    const pageW = 210, pageH = 297, margin = 15, contentW = pageW - 2 * margin;
    let y = margin;

    function ensureSpace(needed) {
      if (y + needed > pageH - margin - 8) { doc.addPage(); y = margin; }
    }
    function setFillHex(hex) {
      doc.setFillColor(parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16));
    }
    function setTextHex(hex) {
      doc.setTextColor(parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16));
    }
    function wrapText(text, maxW, fontSize) {
      doc.setFontSize(fontSize);
      return doc.splitTextToSize(text || '—', maxW);
    }

    // ── HEADER ──
    setFillHex('#8b5cf6');
    doc.rect(0, 0, pageW, 4, 'F');
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(20);
    setTextHex('#0f172a');
    doc.text('QSE', margin, y + 10);
    setTextHex('#8b5cf6');
    doc.text(' INSPECTOR', margin + 16, y + 10);
    setTextHex('#64748b');
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    const formLabel = (tpl && tpl.formLabel) ? tpl.formLabel : ins.title || 'Formulaire';
    doc.text('// ' + formLabel.toUpperCase(), margin, y + 15);
    setTextHex('#475569');
    doc.setFontSize(9);
    doc.setFont('helvetica', 'bold');
    doc.text(profile.company, pageW - margin, y + 8, { align: 'right' });
    doc.setFont('helvetica', 'normal');
    doc.text(profile.name, pageW - margin, y + 12, { align: 'right' });
    doc.text(new Date().toLocaleDateString('fr-FR'), pageW - margin, y + 16, { align: 'right' });
    y += 22;
    setFillHex('#8b5cf6');
    doc.rect(margin, y, contentW, 0.5, 'F');
    y += 6;

    // ── TITRE DU FORMULAIRE ──
    setFillHex('#f5f3ff');
    doc.rect(margin, y, contentW, 18, 'F');
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(14);
    setTextHex('#4c1d95');
    doc.text(formLabel.toUpperCase(), margin + 4, y + 7);
    doc.setFontSize(9);
    doc.setFont('helvetica', 'normal');
    setTextHex('#6d28d9');
    const ref = ins.title ? ins.title : (new Date(ins.createdAt).toLocaleDateString('fr-FR'));
    doc.text('Réf : ' + ref, margin + 4, y + 13);
    // Statut workflow
    if (ins.workflowStatus) {
      doc.setFont('helvetica', 'bold');
      doc.text('Statut : ' + ins.workflowStatus, pageW - margin - 4, y + 7, { align: 'right' });
    }
    // Date + lieu
    doc.setFont('helvetica', 'normal');
    setTextHex('#64748b');
    doc.text('Date : ' + new Date(ins.createdAt).toLocaleDateString('fr-FR'), pageW - margin - 4, y + 13, { align: 'right' });
    y += 22;

    // Infos générales (déclarant, lieu)
    if (ins.inspector || ins.location) {
      doc.setFontSize(9);
      if (ins.inspector) {
        const authorLbl = (tpl && tpl.authorLabel) ? tpl.authorLabel : 'Déclarant';
        doc.setFont('helvetica', 'bold'); setTextHex('#334155');
        doc.text(authorLbl + ' : ', margin, y);
        doc.setFont('helvetica', 'normal');
        doc.text(ins.inspector, margin + doc.getTextWidth(authorLbl + ' : '), y);
        y += 5;
      }
      if (ins.location) {
        const locLbl = (tpl && tpl.locationLabel) ? tpl.locationLabel : 'Lieu';
        doc.setFont('helvetica', 'bold'); setTextHex('#334155');
        doc.text(locLbl + ' : ', margin, y);
        doc.setFont('helvetica', 'normal');
        doc.text(ins.location, margin + doc.getTextWidth(locLbl + ' : '), y);
        y += 5;
      }
      y += 3;
    }

    // ── SECTIONS ET CHAMPS ──
    ins.sections.forEach((sec, sIdx) => {
      ensureSpace(16);

      // Titre de section
      setFillHex('#1e293b');
      doc.rect(margin, y, contentW, 7, 'F');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9);
      setTextHex('#ffffff');
      doc.text((sIdx + 1) + '. ' + (sec.title || '').toUpperCase(), margin + 3, y + 5);
      y += 10;

      sec.items.forEach(item => {
        if (!item.label && !item.question) return;
        const label = item.label || item.question || '';
        // Pour les formulaires déclaratifs, convertir pass/fail en OUI/NON
        let value = '';
        if (item.type === 'passfail' || !item.type) {
          if (item.status === 'pass') value = '✓ OUI';
          else if (item.status === 'fail') value = '✗ NON';
          else if (item.status === 'na') value = 'N/A';
          else value = '—';
        } else {
          value = item.value !== undefined && item.value !== null ? String(item.value) : (item.status || '—');
        }
        const comment = item.comment || '';

        ensureSpace(10);

        // Label du champ
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(8);
        setTextHex('#475569');
        const labelLines = wrapText(label, contentW * 0.45, 8);
        doc.text(labelLines, margin + 2, y + 4);

        // Valeur
        doc.setFont('helvetica', 'normal');
        setTextHex('#0f172a');
        const displayVal = value || '—';
        const valLines = wrapText(displayVal, contentW * 0.5, 9);
        doc.setFontSize(9);
        doc.text(valLines, margin + contentW * 0.48, y + 4);

        const lineH = Math.max(labelLines.length, valLines.length) * 4.5 + 4;

        // Commentaire
        if (comment) {
          ensureSpace(8);
          doc.setFont('helvetica', 'italic');
          doc.setFontSize(7.5);
          setTextHex('#64748b');
          const commentLines = wrapText('→ ' + comment, contentW - 4, 7.5);
          doc.text(commentLines, margin + 4, y + lineH);
          y += lineH + commentLines.length * 4 + 2;
        } else {
          y += lineH;
        }

        // Ligne séparatrice légère
        setFillHex('#f1f5f9');
        doc.rect(margin, y, contentW, 0.3, 'F');
        y += 2;
      });
      y += 4;
    });

    // ── NOTES GÉNÉRALES ──
    if (ins.notes && ins.notes.trim()) {
      ensureSpace(20);
      setFillHex('#fefce8');
      const notesLines = wrapText(ins.notes, contentW - 8, 9);
      const notesH = notesLines.length * 5 + 10;
      doc.rect(margin, y, contentW, notesH, 'F');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9);
      setTextHex('#92400e');
      doc.text('Observations :', margin + 4, y + 6);
      doc.setFont('helvetica', 'normal');
      setTextHex('#78350f');
      doc.text(notesLines, margin + 4, y + 11);
      y += notesH + 6;
    }

    // ── PHOTOS ──
    if (photoCache && photoCache.length > 0) {
      ensureSpace(20);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      setTextHex('#334155');
      doc.text('Photos (' + photoCache.length + ')', margin, y);
      y += 6;
      photoCache.forEach((photo, idx) => {
        ensureSpace(55);
        try {
          doc.addImage(photo.data, 'JPEG', margin + (idx % 2) * (contentW / 2 + 2), y, contentW / 2 - 2, 50);
          if (idx % 2 === 1) y += 54;
        } catch(e) {}
      });
      if (photoCache.length % 2 === 1) y += 54;
      y += 6;
    }

    // ── SIGNATURE ──
    ensureSpace(35);
    y += 4;
    setFillHex('#f8fafc');
    doc.rect(margin, y, contentW, 30, 'F');
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);
    setTextHex('#475569');
    const authorLbl2 = (tpl && tpl.authorLabel) ? tpl.authorLabel : 'Déclarant';
    doc.text(authorLbl2 + ' :', margin + 4, y + 6);
    doc.text('Responsable :', margin + contentW / 2 + 4, y + 6);
    if (ins.signature && ins.signature.data) {
      try { doc.addImage(ins.signature.data, 'PNG', margin + 4, y + 8, 60, 18); } catch(e) {}
    } else {
      setFillHex('#e2e8f0');
      doc.rect(margin + 4, y + 8, 60, 18, 'F');
      doc.setFont('helvetica', 'italic');
      doc.setFontSize(7);
      setTextHex('#94a3b8');
      doc.text('Signature', margin + 28, y + 19, { align: 'center' });
    }
    setFillHex('#e2e8f0');
    doc.rect(margin + contentW / 2 + 4, y + 8, 60, 18, 'F');

    // ── FOOTER ──
    const totalPages = doc.internal.getNumberOfPages();
    for (let i = 1; i <= totalPages; i++) {
      doc.setPage(i);
      setFillHex('#f1f5f9');
      doc.rect(0, pageH - 8, pageW, 8, 'F');
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(7);
      setTextHex('#94a3b8');
      doc.text('QSE Inspector · ' + formLabel + ' · ' + new Date().toLocaleDateString('fr-FR'), margin, pageH - 3);
      doc.text('Page ' + i + ' / ' + totalPages, pageW - margin, pageH - 3, { align: 'right' });
    }

    const safeName = (ins.title || formLabel).replace(/[^a-zA-Z0-9_-]/g, '_').slice(0, 40);
    doc.save(safeName + '-' + new Date().toISOString().slice(0, 10) + '.pdf');
  }

  // ===== RENDERER CHECKLIST =====
  function generatePDFChecklist(ins, photoCache) {
    // Pour l'instant, utilise le renderer audit — à personnaliser ultérieurement
    generatePDFAudit(ins, photoCache);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', render);
  } else {
    render();
  }
})();

</script>
</body>
</html>
